<style>

*{box-sizing:border-box}

#probe{visibility:hidden}
.d1,.d2{display:none}
.lod1 .d1,.lod2 .d2{display:inline}

.dim{opacity:.22}
.m-box{stroke:none}.m-grp{fill:var(--group)}.m-vp{fill:none;stroke:var(--accent);stroke-width:2}

.tabs button{border:0;background:none;color:var(--muted);font-weight:500;min-height:32px;padding:4px 12px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.tabs button:focus-visible{outline-offset:-2px}
#tv{display:none;flex:1;min-height:0;overflow:auto;padding:16px 20px}
.v-tasks #tv{display:block}.v-tasks .main,.v-tasks .legend{display:none}
.tw{display:flex;gap:16px;align-items:flex-start;max-width:1500px;margin:0 auto}.tcards{flex:1;min-width:0}
.toc{position:sticky;top:0;flex:none;width:230px;max-height:calc(100vh - 140px);overflow:auto;display:grid;gap:2px;font-size:var(--fs-s)}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 auto 16px;max-width:1240px}
.plan.cur{border-color:var(--chg);box-shadow:0 0 0 1px var(--chg)}
.plan h2{font:700 var(--fs-l) var(--f-display);margin:0 0 4px}
.plan .meta{font-size:var(--fs-s);color:var(--muted)}
.tag{font:var(--fs-xs) var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:8px;color:var(--muted)}

.vr.PASS{color:var(--done-fg)}.vr.FAIL{color:var(--issue-fg)}

.ph h3{font-size:var(--fs-s);color:var(--muted);margin:0 0 8px;font-weight:600}

.pc b{font-size:var(--fs-m)}
.pc.planned{border-style:dashed;color:var(--muted)}.pc.wip{border-color:var(--wip)}.pc.done{border-color:var(--done)}
.pc.failed{border-color:var(--issue)}.pc.skipped{border-style:dotted;opacity:.65}.pc.extra{border-color:var(--chg);background:var(--chg-bg)}

.pt th{color:var(--muted);font-weight:500}
.xtra{margin-top:8px;font-size:var(--fs-s)}.xtra summary{cursor:pointer;color:var(--chg)}.xtra code{display:inline-block;margin:4px 6px 0 0}
.tnone{color:var(--muted);text-align:center;padding:64px 20px;line-height:1.7}
@media (pointer:coarse){.pill,.tabs button,button.chip{min-height:44px}}
@media (max-width:760px){.main{flex-direction:column}.tw{flex-direction:column;gap:8px}.toc{position:static;display:flex;width:100%;max-height:none;overflow-x:auto;gap:4px}.toc a{flex:none;white-space:nowrap;border:1px solid var(--line)}.panel{width:auto;max-height:38%;border-left:0;border-top:1px solid var(--line)}#mini,.hint{display:none}

<body>
<header class="bar">
  <div class="ttl"><h1 id="title">專案圖解</h1><div id="status">載入中…</div><div id="lede" hidden></div>
    <nav id="crumb" class="crumb" aria-label="目前位置" hidden><button class="pill" id="cfull">全圖</button><span aria-hidden="true">›</span><span id="cname" aria-current="page"></span></nav></div>
  <nav class="tabs" aria-label="檢視"><button data-v="map" class="on">專案地圖</button><button data-v="tasks" id="ttab">任務圖</button></nav>
  <div class="legend" role="group" aria-label="篩選模組">
    <button class="pill" data-f="done" aria-pressed="false"><i class="dot s-done"></i>完成</button>
    <button class="pill" data-f="wip" aria-pressed="false"><i class="dot s-wip"></i>開發中</button>
    <button class="pill" data-f="issue" aria-pressed="false"><i class="dot s-issue"></i>有問題</button>
    <button class="pill" data-f="todo" aria-pressed="false"><i class="dot s-todo"></i>未開始</button>
    <button class="pill" data-f="chg" aria-pressed="false"><i class="dot s-chg"></i>本次改動</button>
    <button class="pill" data-f="plan" aria-pressed="false"><i class="dash"></i>plan 預計會動</button>
    <button class="pill" id="pbtn" aria-expanded="false" aria-controls="psel" hidden></button>
  </div>
  <div class="chipbar">
    <button class="pill warn" id="nbtn" aria-expanded="false" aria-controls="ntc" hidden></button>
    <button class="pill" id="dbtn" aria-expanded="false" aria-controls="drift" hidden></button>
  </div>
  <button class="pill" id="theme" aria-pressed="false">深色</button>
</header>
<div id="ntc" class="drawer" hidden></div>
<div id="drift" class="drawer" hidden></div>
<div id="psel" class="drawer" hidden></div>
<div class="main">
  <div id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="專案架構畫布">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
      <g id="world"></g>
      <text id="probe" x="0" y="-9999"></text>
    </svg>
    <div id="empty"></div>
    <div class="hint" id="hint">拖曳平移 · 滾輪縮放 · 雙擊模組聚焦 · Esc 回全圖</div>
    <svg id="mini" xmlns="http://www.w3.org/2000/svg" aria-label="小地圖"></svg>
    <div class="zoom">
      <button id="zout" aria-label="縮小">−</button><output id="zl">100%</output>
      <button id="zin" aria-label="放大">+</button><button id="zfit">全圖</button>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>
<div id="tv"></div>

// 腳本端已正規化標籤；這裡再防一次，SVG <text> 會把 <br/> 原樣印出來
function clean(s) {
  return String(s == null ? '' : s)
    .replace(/&(amp|lt|gt|quot|#39);/g, function (_, k) { return {amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'"}[k]; })

  if (parent) parent.appendChild(e);

  return clean(s).replace(/[&<>"']/g, function (c) {

    (um.length ? '<h3>還沒對到模組的任務（' + um.length + '）</h3><div class="chips">' + um.slice(0, 12).map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') +
      (um.length > 12 ? '<span class="fdesc">＋' + (um.length - 12) + '</span>' : '') + '</div><div class="fdesc">→ /task-status 會提議補 WBS 的模組欄</div>' : '') +
    '<h3>說明</h3><div class="fdesc">模組由程式碼掃描而來；架構文件有模組表時採用它的名稱與分組。點模組看說明、連線與任務，點檔案會飛到所屬模組。縮小只看燈號，放大到 55% 以上顯示路徑、說明、檔名、任務，110% 以上再顯示每個檔改了多少。虛線框＝選取的 plan 預計會動（「選計畫」可改）。</div>';
}
panel.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-m],button[data-k]'), a = b && IN[b.dataset.k];
  if (a) { innerPanel(a.k); animateTo(fitTo({x: a.x, y: a.y, w: NW, h: NH}, 60, 1.6)); }
  else if (b && b.dataset.m) { leave(); focusMod(b.dataset.m); }
});

// ---------------------------------------------------------------- 任務圖
// 每份 plan 一張卡：階段排成欄、部件是卡片（虛線＝還在計畫、實線＝做了），計畫外的改動收成一行、點開才列檔名
var PST = {planned: '計畫中', wip: '進行中', done: '完成', skipped: '計畫內沒做', failed: '失敗', extra: '計畫外'};
function nums(a) { return (a.added || a.removed) ? '+' + (a.added || 0) + ' / −' + (a.removed || 0) : '—'; }
function partFiles(p, pl) {
  var f = pl.changes.filter(function (c) { return c.part === p.id; }).map(function (c) { return c.file; });
  return f.length ? f : p.files;
}
function partCard(p, pl) {
  var ai = p.ai || {};
  return '<div class="pc ' + esc(p.state) + '"><span class="st ' + esc(p.state) + '">' + esc(PST[p.state] || p.state) +
    (p.planned ? ' · ' + esc(p.id) : '') + '</span><b>' + esc(p.name) + '</b>' +
    (p.planned ? partFiles(p, pl).slice(0, 4).map(function (f) { return '<code>' + esc(f) + '</code>'; }).join('') : '') +
    (ai.summary ? '<span>' + esc(ai.summary) + (ai.source === 'phase' ? '（階段摘要）' : '') + '</span>' : '') +
    '<span class="fdesc">' + esc(nums(ai)) + (ai.tests ? ' · 測試 ' + esc(ai.tests) : '') + '</span></div>';
}
function planCard(pl, i) {
  var cols = (pl.phases || []).map(function (ph) {
    return {t: '階段 ' + ph.n + ' ' + ph.name + ' · ' + (PST[ph.state] || ph.state),
      ps: pl.parts.filter(function (p) { return p.planned && p.phase === ph.n; })};
  });
  var ns = (pl.phases || []).map(function (ph) { return ph.n; });
  var lone = pl.parts.filter(function (p) { return p.planned && ns.indexOf(p.phase) < 0; });
  var ex = pl.parts.filter(function (p) { return !p.planned; });
  if (lone.length) cols.push({t: '沒標階段', ps: lone});
  var xn = pl.extraCount || ex.length, v = pl.verify;
  var from = {completed: '已完成：只顯示階段狀態', none: '沒有執行帳本、也不是本次任務：工作區改動見地圖的「本次改動」'}[pl.changesFrom];
  return '<section id="p' + i + '" class="plan' + (pl.current ? ' cur' : '') + '"><h2>' + (pl.current ? '★ ' : '') + esc((pl.task ? pl.task + ' ' : '') + pl.title) +
    '<span class="tag">' + esc(pl.status || '—') + '</span>' + (pl.source !== 'main' ? '<span class="tag">' + esc(pl.source) + '</span>' : '') + '</h2>' +
    '<div class="meta"><code>' + esc(pl.file) + '</code>' + (pl.mode ? ' · ' + esc(pl.mode) : '') +
    ' · ' + (from ? esc(from) : pl.base ? '比較基準 <code>' + esc(pl.base) + '</code>' : '找不到比較基準') + '</div>' +
    (v ? '<div class="vr ' + esc(v.result) + '">驗證 ' + esc(v.result) + (v.at ? '（' + esc(v.at) + '）' : '') + (v.reason ? ' — ' + esc(v.reason) : '') + '</div>' : '') +
    (cols.length ? '<div class="phs">' + cols.map(function (c) {
      return '<div class="ph"><h3>' + esc(c.t) + '</h3>' + (c.ps.map(function (p) { return partCard(p, pl); }).join('') || '<div class="fdesc">沒有部件</div>') + '</div>';
    }).join('') + '</div>' : '<div class="note">' + (pl.stub ? '資料太多，這份 plan 只留狀態（本次的 plan 不受影響）' : '這份 plan 沒有「一眼看懂」部件表，只列得出改了哪些檔') + '</div>') +
    (xn ? '<details class="xtra"><summary>計畫外 ' + xn + ' 個檔</summary>' + ex.map(function (p) { return '<code>' + esc(p.name) + '</code>'; }).join('') +
      (xn > ex.length ? '<span class="fdesc">另 ' + (xn - ex.length) + ' 個檔沒列出</span>' : '') + '</details>' : '') +
    '<table class="pt"><thead><tr><th>檔案</th><th>部件</th><th>+/−</th><th>AI 做了什麼</th></tr></thead><tbody>' +
    (pl.changes.filter(function (c) { return c.planned; }).map(function (c) {
      var p = pl.parts.filter(function (x) { return x.id === c.part; })[0];
      return '<tr><td><code>' + esc(c.file) + '</code></td><td>' + esc(p ? (p.planned ? p.id + ' ' + p.name : '計畫外') : (c.planned ? '計畫內' : '—')) +
        '</td><td>' + esc(delta(c)) + '</td><td>' + esc(p && p.ai && p.ai.summary || '—') + '</td></tr>';
    }).join('') || ((pl.changesRollup || []).length ? '' : '<tr><td colspan="4" class="fdesc">' + (xn ? '沒有計畫內的改動' : '沒有改動') + '</td></tr>')) +
    (pl.changesRollup || []).map(function (r) {
      return '<tr><td><code>' + esc(r.dir) + '</code> ' + esc(r.files) + ' 個檔</td><td>未逐一列出</td><td>' + esc(nums(r)) + '</td><td>—</td></tr>';
    }).join('') + '</tbody></table></section>';
}
function lamp(pl) {
  var s = pl.status || '';
  return pl.verify && pl.verify.result === 'FAIL' || s.indexOf('🚫') >= 0 ? 'issue' : pl.completed ? 'done' : s.indexOf('🔄') >= 0 ? 'wip' : 'todo';
}
function tocItem(pl, i) {
  return '<a href="#p' + i + '" data-p="p' + i + '"><i class="dot s-' + lamp(pl) + '"></i>' + (pl.current ? '★ ' : '') + esc((pl.task ? pl.task + ' ' : '') + pl.title) + '</a>';
}
$('tv').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-p]'), t = a && $(a.dataset.p);
  if (!t) return;
  e.preventDefault();
  t.scrollIntoView({block: 'start', behavior: reduce ? 'auto' : 'smooth'});
});
function renderTasks(d) {
  var tv = $('tv'), st = tv.scrollTop, ps = d.plans || [];
  $('ttab').textContent = '任務圖' + (ps.length ? '（' + ps.length + '）' : '');
  tv.innerHTML = ps.length ? '<div class="tw"><nav class="toc" aria-label="任務目錄">' + ps.map(tocItem).join('') + '</nav><div class="tcards">' + ps.map(planCard).join('') + '</div></div>'
    : '<div class="tnone">plans/ 底下沒有計畫。<br>跑 /plan 之後，這裡會依階段列出每個部件做了沒、改了哪些檔。</div>';
  tv.scrollTop = st;
}
function view(v) {
  root.classList.toggle('v-tasks', v === 'tasks');
  document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
  if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
  if (v === 'map') { if (pending && D) map(D); firstFit(); apply(); }
}
// 任務圖開著時畫布寬高是 0，量不到字寬也算不出全圖縮放；切回地圖才補做
function firstFit() {
  if (fitted || !MODS.length || !stage.clientWidth) return;
  var f = fitTo(ALL, 16, 1); S.tx = f.tx; S.ty = f.ty; S.k = f.k; fitted = true;
}
document.querySelector('.tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-v]'); if (b) view(b.dataset.v);
});

// ---------------------------------------------------------------- 資料
function setStatus(text, stale) { var s = $('status'); s.textContent = text; s.className = stale ? 'stale' : ''; }
function when(d) { return String(d.generatedAt || '').replace('T', ' ').slice(0, 19); }
function map(d) {
  if (!canMeasure()) { pending = true; return; }
  pending = false;
  layout(d);
  if (INNER && !BY[INNER]) INNER = null;
  var m = INNER && BY[INNER], msg = m ? noInner(m) : '';
  root.classList.toggle('v-inner', !!m);
  $('crumb').hidden = !m;
  $('cname').textContent = m ? clean(m.name) : '';
  $('hint').textContent = HINT[m ? 1 : 0];
  $('zfit').textContent = m ? '整個模組' : '全圖';
  if (m) {
    $('empty').classList.toggle('on', !!msg);
    $('empty').textContent = msg;
    if (msg) { GB = []; IN = {}; world.replaceChildren(); drawMini([]); } else drawInner(m);
    return innerPanel(nsel);
  }
  var none = !MODS.length;
  $('empty').classList.toggle('on', none);
  $('empty').textContent = none ? ((d.notices[0] && clean(d.notices[0].text)) || '沒有可畫的模組') : '';
  draw(d);
  select(selected);
}
function render(d) {
  D = null; MODS = []; BY = {};
  if (d.schema !== SCHEMA) {
    INNER = null; root.classList.remove('v-inner'); $('crumb').hidden = true;
    world.replaceChildren(); mini.replaceChildren(); panel.innerHTML = '';
    $('empty').classList.add('on');
    $('empty').textContent = '資料格式是舊版（schema ' + (d.schema == null ? '不明' : d.schema) + '），請重產（跑一次 /task-status）';
    setStatus('資料時間 ' + when(d), true);
    return;
  }
  // 沒有 jq 時 data.js 只有 notices（overview.sh 用 printf 寫的），其餘欄位補成空的
  ['modules', 'groups', 'edges', 'tasks', 'plans', 'changes', 'changesRollup', 'notices', 'unmappedTasks'].forEach(function (k) { d[k] = d[k] || []; });
  D = d;
  document.title = '專案圖解 — ' + clean(d.project && d.project.name);
  $('title').innerHTML = '專案圖解 — ' + esc(d.project && d.project.name) + (d.project && d.project.architectureDraft ? '<span class="draft">架構草稿</span>' : '');
  renderTasks(d);
  header(d);
  planSel(d);
  map(d);
  firstFit();
  apply();
  setStatus(okText(d), false);
}
function okText(d) { return '資料時間 ' + when(d) + (d.scan && d.scan.files ? ' · 掃描 ' + d.scan.files + ' 個檔' : ''); }

// 輪詢：每次插一個新的 classic script（帶 ?t= 避開快取）。載入前把 window.OVERVIEW 設成 null，
// 載入後仍是 null ＝ 檔案寫到一半（語法錯誤）或暫時不存在 → 保留上一份、顯示「更新中」。
// 這招成立的前提是 data.js 只有一句賦值（overview.sh 保證）。
var timer = null, inflight = false, last = null;
function check() {
  if (inflight) return;
  inflight = true;
  var prev = window.OVERVIEW;
  window.OVERVIEW = null;
  var s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();
  function done() {
    s.remove(); inflight = false;
    var next = window.OVERVIEW;
    if (!next) {
      window.OVERVIEW = prev;
      setStatus('更新中…（資料時間 ' + (last ? when(last) : '—') + '）', true);
      return;
    }
    if (!last || next.generatedAt !== last.generatedAt) { last = next; render(next); }
    else if (D) setStatus(okText(D), false);
  }
  s.onload = done; s.onerror = done;
  document.head.appendChild(s);
}
function start() { if (!timer) timer = setInterval(check, POLL_MS); }
function stop() { clearInterval(timer); timer = null; }
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { check(); start(); } else stop();
});
new ResizeObserver(function () { drawVp(); }).observe(stage);

view(location.hash === '#tasks' ? 'tasks' : 'map');
document.fonts.ready.then(function () {
  if (window.OVERVIEW) { last = window.OVERVIEW; render(last); }
  else { setStatus('找不到 data.js——跑一次 /task-status 產生', true); summary(); }
  if (document.visibilityState === 'visible') start();
});
})();
</script>
</body>
